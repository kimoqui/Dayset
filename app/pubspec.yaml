name: dayset
description: "DaySet - 자동으로 짜주는 일정으로 편하게 생활습관 잡기"
publish_to: "none"
version: 0.9.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  home_widget: ^0.7.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  file_picker: ^8.1.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  alarm: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
    # 파스텔 다이어리 테마: 보통 글자는 고운돋움, 굵은 글자(제목·단추)는 주아(둘 다 SIL OFL 1.1, 한글 2,350자 묶음)
    - family: DaySetPastel
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
          weight: 400
        - asset: assets/fonts/GowunDodum-Regular.ttf
          weight: 500
        - asset: assets/fonts/Jua-Regular.ttf
          weight: 600
        - asset: assets/fonts/Jua-Regular.ttf
          weight: 700
